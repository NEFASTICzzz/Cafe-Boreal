# ==============================================================================
# Cafe Boreal S.R.L. - Nginx Frontal Reverse Proxy & TLS Hardening
# UTN ITI-522 Computacion en la Nube
# FRASE UNICA ANTI-FRAUDE: "café frío, LO cálido, ¡no puedo perderlo!"
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Compresion GZIP & Brotli
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Dynamic upstream configuration
    upstream catalog_service {
        server catalog-api:3001;
    }

    upstream orders_service {
        server orders-api:3002;
    }

    upstream customers_service {
        server customers-api:3003;
    }

    upstream legacy_service {
        server legacy-app:80;
    }

    upstream frontend_service {
        server frontend-app:80;
    }

    # Redirección obligatoria HTTP (80) -> HTTPS (443)
    server {
        listen 80;
        server_name localhost _;
        return 301 https://$host$request_uri;
    }

    # Servidor HTTPS TLS Autofirmado
    server {
        listen 443 ssl http2;
        server_name localhost;

        # TLS Certificates (Autofirmados)
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Hardening de TLS/SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Headers de Seguridad
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer-when-downgrade";
        add_header X-Anti-Fraud-Token "cafe_frio_LO_calido_no_puedo_perderlo";

        # Frontend PWA (Root)
        location / {
            proxy_pass http://frontend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Ruteo Microservicios K8s (/api/*)
        location /api/catalog {
            proxy_pass http://catalog_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/orders {
            proxy_pass http://orders_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/customers {
            proxy_pass http://customers_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Ruteo Módulo Legado (/legacy/*) -> Apache/PHP
        location /legacy/ {
            proxy_pass http://legacy_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /legacy {
            rewrite ^/legacy(.*)$ /legacy/$1 permanent;
        }
    }
}
