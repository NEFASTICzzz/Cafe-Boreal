global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'catalog-api'
    static_configs:
      - targets: ['catalog-api:3001']

  - job_name: 'orders-api'
    static_configs:
      - targets: ['orders-api:3002']

  - job_name: 'customers-api'
    static_configs:
      - targets: ['customers-api:3003']
